name: Static source checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q dual_ebm 'UniversalFakeDetect_Benchmark - 副本' DeepfakeBench tests
      - run: bash -n 'UniversalFakeDetect_Benchmark - 副本/script/train_svd.sh' 'UniversalFakeDetect_Benchmark - 副本/script/test.sh'
